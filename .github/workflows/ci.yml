name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code -- dist
      - run: node scripts/verify-package.mjs
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Review the complete dependency tree
        run: npm audit --audit-level=low
      - name: Check dependency licenses and public package boundary
        run: node scripts/verify-package.mjs
      - name: Review dependency changes in pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: MIT, Apache-2.0
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939
